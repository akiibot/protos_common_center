name: Bug report
description: Report a reproducible problem in Protos Common Center.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Change...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical — security, data loss, or application unavailable
        - High — primary workflow blocked
        - Medium — workflow impaired with a workaround
        - Low — minor or visual problem
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows 11, Safari on iPhone, etc.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or supporting information

